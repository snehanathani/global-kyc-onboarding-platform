version: '3.8'

services:
  app:
    build: .
    container_name: wise-kyc-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/wise_kyc
      - SPRING_DATASOURCE_USERNAME=wise_admin
      - SPRING_DATASOURCE_PASSWORD=wise_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - wise-net

  postgres:
    image: postgres:16-alpine
    container_name: wise-kyc-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wise_kyc
      POSTGRES_USER: wise_admin
      POSTGRES_PASSWORD: wise_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wise_admin -d wise_kyc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wise-net

  redis:
    image: redis:7-alpine
    container_name: wise-kyc-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wise-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: wise-kyc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    networks:
      - wise-net

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: wise-kyc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - wise-net

volumes:
  pgdata:

networks:
  wise-net:
    driver: bridge
